# Shared proxy headers / timeouts for upstream Spring Boot

proxy_http_version 1.1;
proxy_set_header Connection "";

# Preserve real client identity for the app (and for app-side audit logs)
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Correlation key: same value lands in Nginx JSON logs AND Spring MDC
proxy_set_header X-Request-ID      $req_id;
add_header       X-Request-ID      $req_id always;

# Timeouts — tune for your SLOs; slow upstream still recorded in upstream_response_time
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Buffering: on by default; disable for streaming responses if needed
proxy_buffering on;
