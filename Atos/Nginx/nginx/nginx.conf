worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version in responses
    server_tokens off;

    # --- Telemetry: structured JSON access log ---
    # Ship this file to ELK, Loki, Datadog, Splunk, etc.
    log_format telemetry_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$req_id",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"args":"$args",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_header_time":"$upstream_header_time",'
            '"http_user_agent":"$http_user_agent",'
            '"http_referer":"$http_referer",'
            '"scheme":"$scheme",'
            '"host":"$host",'
            '"server_protocol":"$server_protocol"'
        '}';

    # Human-readable access log (optional; keep for local debugging)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'urt="$upstream_response_time" rid=$req_id';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/access.json.log telemetry_json;

    sendfile        on;
    keepalive_timeout  65;

    # Compress responses from the edge (app can stay uncompressed)
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;

    # Upstream pool for the Spring Boot app
    upstream orders_api {
        least_conn;
        server app:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
