# Map an incoming / generated request id into $req_id for logging + propagation
map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;   # nginx built-in unique id (requires nginx >= 1.11)
}

server {
    listen 80;
    server_name localhost;

    # Larger buffers help when logging / proxying JSON APIs
    client_max_body_size 10m;

    # --- Edge telemetry endpoint (no app hit) ---
    # Useful for load-balancer health checks and basic scrape targets
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # typical Docker bridge ranges
        deny all;
    }

    # Actuator / health — proxy through, but you may want to lock this down in prod
    location /actuator/ {
        proxy_pass http://orders_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Application API
    location /api/ {
        proxy_pass http://orders_api;
        include /etc/nginx/proxy_params.conf;

        # Per-location overrides for telemetry-sensitive paths
        # Slow requests (>1s) still appear in access.json.log via request_time
    }

    # Demo: intentional 5xx path for log/alert pipelines
    location = /api/orders/health-demo/boom {
        proxy_pass http://orders_api;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        return 200 '{"service":"orders-edge","hint":"POST /api/orders or GET /api/orders/{id}"}\n';
        add_header Content-Type application/json;
    }
}
