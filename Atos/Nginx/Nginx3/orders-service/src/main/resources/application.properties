server.port=8082
spring.application.name=orders-service

# Actuator health endpoint used by Docker/Kubernetes probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# stock-service base URL.
# ${ENV_VAR:default} — if STOCK_SERVICE_BASE_URL is set (Compose/K8s), it wins;
# otherwise the default after the colon is used.
stock.service.base-url=${STOCK_SERVICE_BASE_URL:http://stock-service:8083}

# Application request logs + stock client timing. Use DEBUG for sleep details.
logging.level.com.example.orders=INFO
