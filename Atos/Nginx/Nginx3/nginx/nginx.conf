# =============================================================================
# nginx.conf — educational reverse proxy for the nginx-learning project
# =============================================================================
#
# High-level request flow:
#
#   Client
#     |
#     | :80
#     v
#   NGINX (this file)
#     |
#     +---- location /users*      ----> upstream users_backend  ----> users-service:8081
#     |
#     +---- location /orders*     ----> upstream orders_backend ----> orders-service:8082
#     |                                                              |
#     |                                                              +--> stock-service:8083
#     |                                                                  (service-to-service)
#     |
#     +---- location /stock*      ----> upstream stock_backend  ----> stock-service:8083
#     |
#     +---- location /telemetry*  ----> static log viewer + access.log
#     |
#     +---- location /            ----> 404
#
# This same file is used by Docker Compose (mounted) and by Kubernetes
# (stored in a ConfigMap and mounted into the NGINX Pod).
# =============================================================================

# -----------------------------------------------------------------------------
# events { }
# Worker-process connection settings (how NGINX handles concurrent connections).
# Even an empty block is required in a full nginx.conf.
# -----------------------------------------------------------------------------
events {
    # Max simultaneous connections per worker process (fine for local learning).
    worker_connections 1024;
}

# -----------------------------------------------------------------------------
# http { }
# Context for all HTTP-related configuration: upstreams, servers, MIME types,
# logging, gzip, etc. Almost every reverse-proxy setting lives here.
# -----------------------------------------------------------------------------
http {
    # Useful defaults for serving/proxying HTTP.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    index         index.html;

    # -------------------------------------------------------------------------
    # log_format
    # Defines a named access-log layout. Variables are filled per request.
    #
    # Telemetry fields of interest:
    #   $request_time
    #     Total time (seconds) from accepting the client request until sending
    #     the last byte of the response — NGINX + upstream + network.
    #
    #   $upstream_response_time
    #     Time (seconds) spent talking to the upstream backend(s) only.
    #     Empty for non-proxied locations; comma-separated if several tries.
    #
    # escape=json makes each field JSON-safe so the log is NDJSON (one object
    # per line) — easy for browsers and log pipelines to parse.
    # -------------------------------------------------------------------------
    log_format telemetry escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_header_time":"$upstream_header_time",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    # Apply the telemetry format to the access log.
    access_log /var/log/nginx/access.log telemetry;
    error_log  /var/log/nginx/error.log;

    # -------------------------------------------------------------------------
    # upstream { }
    # An "upstream" is a named group of one or more backend servers.
    # proxy_pass then references the group by name instead of hard-coding hosts.
    #
    # With a single server entry, NGINX always forwards to that one backend.
    # With multiple server entries, NGINX load-balances across them.
    # Default algorithm: round-robin (request 1 -> server A, request 2 -> server B, ...).
    #
    # In Docker Compose, "users-service" resolves via Compose DNS.
    # In Kubernetes, "users-service" resolves via Kubernetes Service DNS —
    # NGINX talks to the Service; the Service then picks a Pod.
    # -------------------------------------------------------------------------
    upstream users_backend {
        # "server" inside an upstream names one backend member of the group.
        server users-service:8081;
    }

    upstream orders_backend {
        server orders-service:8082;
    }

    upstream stock_backend {
        server stock-service:8083;
    }

    # Example: multiple instances for NGINX-level round-robin load balancing.
    # (Not used by the running app — illustrated for learning only.)
    #
    # upstream users_backend {
    #     server users-service-1:8081;
    #     server users-service-2:8081;
    #     server users-service-3:8081;
    # }
    #
    # In THIS project we prefer a single upstream target (the Kubernetes Service
    # or Compose service name). Kubernetes then distributes across Pods.
    # That shows the distinction:
    #   - NGINX upstream  -> chooses which backend *address* (here: the Service)
    #   - K8s Service     -> chooses which Pod behind that Service

    # -------------------------------------------------------------------------
    # server { }
    # A virtual server that handles requests for a listen address (and optional
    # server_name). Think of it as one "site" or listener configuration.
    # -------------------------------------------------------------------------
    server {
        # ---------------------------------------------------------------------
        # listen
        # Port (and optional address) this server accepts connections on.
        # Clients reach NGINX at http://localhost:80 (Docker) or via
        # port-forward / NodePort (Kubernetes).
        # ---------------------------------------------------------------------
        listen 80;

        # Optional: match Host header. "_" is a catch-all placeholder.
        server_name _;

        # ---------------------------------------------------------------------
        # location
        # Matches the request URI path and decides what to do with it
        # (proxy, return static content, redirect, etc.).
        #
        # Prefix locations like "/users" match any URI that starts with that
        # string: /users, /users/, /users/123, /users/debug, ...
        # ---------------------------------------------------------------------

        # --- Users API -------------------------------------------------------
        # Running behaviour: NO trailing slash on proxy_pass.
        #
        #   location /users  +  proxy_pass http://users_backend;
        #
        # Request URI is passed to the upstream UNCHANGED:
        #   Client:  /users/123
        #   Backend: /users/123
        #
        # Contrast (documented only — not used below):
        #   location /users/  +  proxy_pass http://users_backend/;
        # would REPLACE the matched "/users/" prefix with "/", so:
        #   Client:  /users/123
        #   Backend: /123
        # See README "Trailing-slash behaviour" for a full walkthrough.
        # ---------------------------------------------------------------------
        location /users {
            # proxy_pass: forward the request to the named upstream group.
            # No trailing slash => preserve full original URI path.
            proxy_pass http://users_backend;

            # -----------------------------------------------------------------
            # proxy_set_header
            # By default NGINX may overwrite or omit headers the backend needs.
            # These directives set/preserve useful forwarding headers.
            #
            # $host
            #   Host header from the original client request (or server_name).
            #   Lets the backend know which hostname the client used.
            #
            # $remote_addr
            #   IP address of the direct client connecting to NGINX.
            #   Put into X-Real-IP so the backend sees the "true" client IP
            #   (from NGINX's point of view), not NGINX's own address.
            #
            # $proxy_add_x_forwarded_for
            #   Appends $remote_addr to any existing X-Forwarded-For header.
            #   Useful when there are multiple proxies in a chain.
            #
            # $scheme
            #   "http" or "https" — the scheme the client used to reach NGINX.
            # -----------------------------------------------------------------
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # -----------------------------------------------------------------
            # proxy_*_timeout
            # Backends intentionally sleep a random 0–10s for telemetry demos.
            # proxy_read_timeout is how long NGINX waits for the upstream
            # response; if it is shorter than the backend delay, clients see
            # 504 Gateway Timeout and upstream_response_time looks truncated.
            # -----------------------------------------------------------------
            proxy_connect_timeout 5s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }

        # --- Orders API ------------------------------------------------------
        location /orders {
            proxy_pass http://orders_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Same timeouts as /users — backends may sleep up to 10s.
            # Orders also calls stock-service (up to +10s), so allow headroom.
            proxy_connect_timeout 5s;
            proxy_send_timeout    25s;
            proxy_read_timeout    25s;
        }

        # --- Stock API (direct via NGINX; also called by orders-service) -----
        location /stock {
            proxy_pass http://stock_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }

        # --- Telemetry log viewer (browser) ----------------------------------
        # Serves a small HTML tool that fetches /telemetry/access.log and
        # displays request_time / upstream_response_time in a table.
        #
        # access_log off avoids polluting the telemetry log with self-traffic.
        # Learning-only: do not expose raw access logs this way in production.
        # ---------------------------------------------------------------------
        location = /telemetry {
            return 302 /telemetry/;
        }

        location /telemetry/ {
            alias /usr/share/nginx/html/telemetry/;
            access_log off;
        }

        location = /telemetry/access.log {
            alias /var/log/nginx/access.log;
            default_type application/x-ndjson;
            charset utf-8;
            add_header Cache-Control "no-store";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        location /doom {
            default_type text/plain;
            return 404 "Doom!\n";
        }

        # --- Fallback --------------------------------------------------------
        # Anything that did not match /users, /orders, /stock, or /telemetry returns 404.
        location / {
            default_type text/plain;
            return 404 "Unknown endpoint\n";
        }
    }
}
