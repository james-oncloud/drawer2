# Docker Compose — Stage 2 of the learning progression
#
# Architecture:
#   Client -> nginx:80 -> users-service:8081
#                      -> orders-service:8082 -> stock-service:8083
#                      -> stock-service:8083   (also reachable directly via /stock)
#                      -> /telemetry (log viewer + access.log)
#
# Compose creates a shared network. Service names become DNS names that
# NGINX upstreams (and orders-service → stock-service) can resolve.

services:
  users-service:
    build: ./users-service
    container_name: users-service
    ports:
      # Exposed for local debugging; normal traffic goes through NGINX.
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  stock-service:
    build: ./stock-service
    container_name: stock-service
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  orders-service:
    build: ./orders-service
    container_name: orders-service
    ports:
      - "8082:8082"
    environment:
      # Inside the Compose network, use the stock-service DNS name — NOT localhost
      # (localhost in this container is orders-service itself).
      STOCK_SERVICE_BASE_URL: http://stock-service:8083
    depends_on:
      stock-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      # Only entry point you normally need.
      - "80:80"
    volumes:
      # Mount our educational config over the default nginx.conf.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Browser log viewer (http://localhost/telemetry/).
      - ./nginx/html/telemetry:/usr/share/nginx/html/telemetry:ro
      # Persist NDJSON access logs (request_time, upstream_response_time, …).
      - ./nginx/logs:/var/log/nginx
    depends_on:
      users-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      stock-service:
        condition: service_healthy
