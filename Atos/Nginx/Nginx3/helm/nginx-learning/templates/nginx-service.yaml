apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-learning.nginxServiceName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: nginx
    {{- include "nginx-learning.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    app: nginx
  ports:
    - name: http
      port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
